<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Loose Ends browser acceptance</title><style>body{font:15px system-ui;background:#07111f;color:#e9f1f7;margin:20px}h1{font-size:24px}label{display:inline-grid;gap:6px;margin:8px}button,select{font:inherit;min-height:44px;padding:8px;background:#162d42;color:#fff;border:1px solid #55708b;border-radius:6px}#stage{overflow:auto;margin-top:16px}iframe{height:820px;border:1px solid #55708b;background:#07111f}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#77dcbc}</style></head><body><h1>Browser acceptance</h1><p>Read-only checks against the existing application. Uses the signed-in browser session. Does not submit forms, enable policies or send customer messages.</p><label>Viewport<select id="width"><option>375</option><option>390</option><option>768</option><option>1366</option></select></label><button id="resize">Set viewport</button><button id="run">Run read-only acceptance</button><button id="export" type="button">Export JSON report</button><a href="/dashboard">Return to dashboard</a><p id="status" role="status">Sign in through the dashboard first.</p><details open><summary>Acceptance results</summary><pre id="results">Not run.</pre></details><div id="stage"><iframe id="app" title="Loose Ends live application at the selected viewport" src="/dashboard" width="375"></iframe></div><script src="acceptance.js"></script></body></html>
