<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Loose Ends browser acceptance</title><style>body{font:15px system-ui;background:#07111f;color:#e9f1f7;margin:20px}h1{font-size:24px}label{display:inline-grid;gap:6px;margin:8px}button,select{font:inherit;min-height:44px;padding:8px;background:#162d42;color:#fff;border:1px solid #55708b;border-radius:6px}#stage{overflow:auto;margin-top:16px}iframe{height:820px;border:1px solid #55708b;background:#07111f}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#77dcbc}button:disabled{opacity:.45;cursor:not-allowed}#status{padding:12px 14px;border:1px solid #385368;border-radius:9px;background:#102439;overflow-wrap:anywhere}#stage{max-width:100%;border-radius:12px}iframe{max-width:none}#results{max-height:360px;overflow:auto;border:1px solid #385368;padding:12px;border-radius:8px}#controls{display:flex;flex-wrap:wrap;align-items:end;gap:9px;margin:16px 0}#controls label{margin:0}#controls button{flex:0 1 auto}#controls a{padding:11px 0}@media(max-width:650px){body{margin:12px;font-size:14px}h1{font-size:21px}#controls{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#controls label{grid-column:1/-1}#controls select{width:100%}#controls button{white-space:normal;min-width:0}#controls a{grid-column:1/-1}#stage{overflow-x:auto}#results{max-height:240px}}</style></head><body><h1>Browser acceptance</h1><p>Read-only checks against the existing application. Uses the signed-in browser session. Does not submit forms, enable policies or send customer messages.</p><div id="controls"><label>Viewport<select id="width"><option>375</option><option>390</option><option>768</option><option>1366</option></select></label><button id="resize">Set viewport</button><button id="run">Run read-only acceptance</button><button id="export" type="button">Export JSON report</button><a href="/dashboard">Return to dashboard</a></div><p id="status" role="status">Sign in through the dashboard first.</p><details open><summary>Acceptance results</summary><pre id="results">Not run.</pre></details><div id="stage"><iframe id="app" title="Loose Ends live application at the selected viewport" src="/dashboard" width="375"></iframe></div><script src="acceptance.js"></script></body></html>
