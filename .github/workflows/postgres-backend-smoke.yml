name: PostgreSQL backend smoke tests
on:
  pull_request:
    paths:
      - 'supabase/migrations/**'
      - 'scripts/postgres-backend-smoke.sql'
      - '.github/workflows/postgres-backend-smoke.yml'
  workflow_dispatch:
jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: smoke
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smoke"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: smoke
    steps:
      - uses: actions/checkout@v4
      - name: Run real PostgreSQL migration and transaction smoke tests
        run: psql -X -v ON_ERROR_STOP=1 -f scripts/postgres-backend-smoke.sql
