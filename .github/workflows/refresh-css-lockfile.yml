name: Refresh CSS dependency lockfile
on:
  push:
    branches: [security/upgrade-tailwind-build-20261016]
    paths: [.github/workflows/refresh-css-lockfile.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/upgrade-tailwind-build-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm ci
          npm run typecheck
          npm run build
      - name: Commit dependency lockfile
        run: |
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'chore: lock refreshed CSS build dependencies'
          git push origin HEAD:security/upgrade-tailwind-build-20261016
