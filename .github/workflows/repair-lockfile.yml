name: Repair dependency lockfile
on:
  push:
    branches: [ci/lockfile-consistency-20261016]
    paths: [.github/workflows/repair-lockfile.yml]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ci/lockfile-consistency-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Regenerate lockfile without changing package versions
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit corrected lockfile
        run: |
          git diff --exit-code -- package.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile already current"
            exit 0
          fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: synchronize dependency lockfile'
          git push origin HEAD:ci/lockfile-consistency-20261016
