name: Weekly SMB Lead Scout

on:
  schedule:
    # Runs once per week every Sunday at 06:00 UTC ($0 zero-key Overpass + crawler pipeline)
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci
          npm install -g tsx

      - name: Refill public_leads via Zero-Cost Scout
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          DEFAULT_WORKSPACE_ID: ${{ secrets.DEFAULT_WORKSPACE_ID }}
          TARGET_MARKET: ${{ vars.TARGET_MARKET || 'United States' }}
        run: npm run scout
