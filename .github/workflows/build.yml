name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Catch syntax errors across every app module before installing dependencies.
      - run: find v3.1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      # Fail if package.json and the committed lockfile drift apart.
      # This makes CI dependency resolution reproducible.
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json'); const v=a.metadata?.vulnerabilities || {}; console.log('Dependency audit:', JSON.stringify(v)); if ((v.critical || 0) > 0) { console.error('Critical dependency vulnerabilities detected'); process.exit(1) }"
      - name: Audit production runtime dependencies
        run: |
          npm audit --omit=dev --json > production-dependency-audit.json || true
          node -e "const a=require('./production-dependency-audit.json'); const v=a.metadata?.vulnerabilities || {}; console.log('Production dependency audit:', JSON.stringify(v)); if ((v.high || 0) > 0 || (v.critical || 0) > 0) { console.error('High or critical runtime dependency vulnerabilities detected'); process.exit(1) }"
      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: production-dependency-audit.json
          if-no-files-found: warn
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
      - run: npm run typecheck
      - run: npm run build
