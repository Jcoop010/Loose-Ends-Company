name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # Catch syntax errors across every app module before installing dependencies.
      - run: find v3.1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      # The committed lockfile predates the Supabase runtime dependency.
      # npm install resolves the manifest/lockfile drift; typecheck/build then
      # validate the actual production dependency graph.
      - run: npm install
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > dependency-audit.json || true
          node -e "const a=require('./dependency-audit.json'); console.log('Dependency audit:', JSON.stringify(a.metadata?.vulnerabilities || {}))"
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
      - run: npm run typecheck
      - run: npm run build
