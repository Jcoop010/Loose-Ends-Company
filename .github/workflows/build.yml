name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The repository's lockfile has historically drifted from package.json.
      # Use npm install in CI so validation tests the actual dependency graph;
      # lockfile cleanup can be handled separately without blocking releases.
      - run: npm install --no-audit --no-fund
      - run: npm run build
