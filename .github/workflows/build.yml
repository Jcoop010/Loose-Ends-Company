name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Catch syntax errors across every app module before installing dependencies.
      - run: find v3.1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      # Fail if package.json and the committed lockfile drift apart.
      # This makes CI dependency resolution reproducible.
      - run: npm ci
      - name: Audit dependency vulnerabilities
        run: |
          npm audit --json > dependency-audit.json || true
          node scripts/check-dependency-audit.mjs dependency-audit.json full
      - name: Audit production runtime dependencies
        run: |
          npm audit --omit=dev --json > production-dependency-audit.json || true
          node scripts/check-dependency-audit.mjs production-dependency-audit.json runtime
      - name: Upload production dependency audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-dependency-audit
          path: production-dependency-audit.json
          if-no-files-found: warn
      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit
          path: dependency-audit.json
          if-no-files-found: warn
      - run: node tests/dependency-audit.test.mjs
      - run: npm run test:scanner
      - run: node tests/background-workflow.test.mjs
      - run: node tests/workflow-security.test.mjs
      - run: node tests/launch-readiness.test.mjs
      - run: node tests/launch-center-regression.test.mjs
      - run: node tests/autopilot-approval.test.mjs
      - run: node tests/recovery-delivery-preflight.test.mjs
      - run: node tests/verified-collections-ui.test.mjs
      - run: node tests/guided-sales-demo.test.mjs
      - run: node tests/workspace-pagination.test.mjs
      - run: node tests/customer-server-search.test.mjs
      - run: node tests/customer-import-guard.test.mjs
      - run: node tests/customer-bulk-import-server.test.mjs
      - run: node tests/customer-import-http.test.mjs
      - run: node tests/secure-checkout.test.mjs
      - run: npm run test:runtime
      - run: npm run test:recovery
      - run: npm run typecheck
      - run: npm run build
