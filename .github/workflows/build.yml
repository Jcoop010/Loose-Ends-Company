name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      # The committed lockfile predates the Supabase runtime dependency.
      # npm install resolves the manifest/lockfile drift; typecheck/build then
      # validate the actual production dependency graph.
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
