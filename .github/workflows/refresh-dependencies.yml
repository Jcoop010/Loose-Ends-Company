name: Refresh vulnerable dependencies
on:
  push:
    branches: [fix/nonbreaking-dependency-audit-20261016]
    paths: [.github/workflows/refresh-dependencies.yml]
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/nonbreaking-dependency-audit-20261016
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply only nonbreaking audit fixes
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm ci
          npm run typecheck
          npm run build
      - name: Commit audited lockfile
        run: |
          git diff --exit-code -- package.json
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: update nonbreaking vulnerable transitive dependencies'
          git push origin HEAD:fix/nonbreaking-dependency-audit-20261016
