name: Security PR Validation

on:
  workflow_dispatch:
  push:
    branches:
      - security/harden-billing-cors-20261013
  pull_request:
    branches:
      - feat/autonomy-center-20261012

concurrency:
  group: loose-ends-security-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check JavaScript syntax
        run: find v3.1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check security invariants
        run: node scripts/security-regression-check.mjs
      - name: Install dependencies without mutating the branch
        run: npm install
      - name: Report dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Summarize dependency audit
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          for (const [name, vulnerability] of Object.entries(audit.vulnerabilities ?? {})) {
            console.log(`${name}: ${vulnerability.severity} | direct=${vulnerability.isDirect} | fixAvailable=${JSON.stringify(vulnerability.fixAvailable)}`);
          }
          NODE
      - name: Fail on remaining known vulnerabilities
        run: npm audit --audit-level=moderate
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
