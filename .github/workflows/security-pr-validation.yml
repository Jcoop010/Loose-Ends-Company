name: Security PR Validation

on:
  workflow_dispatch:
  push:
    branches:
      - security/harden-billing-cors-20261013
  pull_request:
    branches:
      - feat/autonomy-center-20261012

concurrency:
  group: loose-ends-security-validation-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

jobs:
  security-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Check JavaScript syntax
        run: find v3.1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check security invariants
        run: node scripts/security-regression-check.mjs
      - name: Resolve dependencies and refresh lockfile
        run: npm install
      - name: Apply compatible dependency security updates
        run: npm audit fix || true
      - name: Report dependency audit
        run: npm audit --json > npm-audit.json || true
      - name: Enforce dependency audit policy
        run: |
          node --input-type=module <<'NODE'
          import fs from "node:fs";
          const audit = JSON.parse(fs.readFileSync("npm-audit.json", "utf8"));
          const allowedAdvisories = new Set([
            "https://github.com/advisories/GHSA-vfj7-8cjw-p6xm"
          ]);
          const unresolved = [];
          for (const [name, vulnerability] of Object.entries(audit.vulnerabilities ?? {})) {
            for (const advisory of vulnerability.via ?? []) {
              if (typeof advisory === "string") continue;
              const url = advisory.url ?? "";
              if (!allowedAdvisories.has(url)) {
                unresolved.push({
                  package: name,
                  severity: vulnerability.severity,
                  advisory: url || advisory.name || "unknown advisory",
                  title: advisory.title ?? ""
                });
              }
            }
          }
          console.log(JSON.stringify({
            counts: audit.metadata?.vulnerabilities ?? {},
            explicitlyAllowedBuildToolAdvisories: [...allowedAdvisories],
            unresolved
          }, null, 2));
          if (unresolved.length) process.exit(1);
          NODE
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Commit the tested npm lockfile and validate its commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ! git diff --quiet -- package-lock.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add package-lock.json
            git commit -m "chore: refresh npm lockfile from validated dependency resolution"
            git push origin HEAD:"${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/Jcoop010/Loose-Ends-Company/actions/workflows/security-pr-validation.yml/dispatches \
              -d '{"ref":"security/harden-billing-cors-20261013"}'
          else
            echo "package-lock.json is already synchronized."
          fi
